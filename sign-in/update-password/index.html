  <title>Choose New Password | AutoLearnPro</title>
  <link rel="stylesheet" href="/sign-in/sign-in.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="https://autolearnpro.com/">← AutoLearnPro</a>
    <section class="auth-card" aria-labelledby="updatePasswordTitle">
      <p class="small">Account recovery</p>
      <h1 id="updatePasswordTitle">Choose a new password</h1>
      <p id="passwordHelp">Use at least 8 characters and avoid common or easily guessed passwords.</p>
      <form id="updatePasswordForm">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="passwordHelp" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button id="updatePasswordButton" type="submit">Update Password</button>
      </form>      <div id="status" class="status hidden" role="status" aria-live="polite"></div>
      <p class="small"><a href="/sign-in/recover/">Request a new reset link</a>.</p>
    </section>
  </main>
