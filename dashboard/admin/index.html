<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Review | AutoLearnPro</title>
  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/theme/layout.css">
  <link rel="stylesheet" href="/theme/dashboard.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="tm-shell admin-shell">
    <header class="tm-page-header">
      <div>
        <p class="tm-eyebrow">Platform administration</p>
        <h1>Instructor affiliation review</h1>
        <p>Approve or reject pending instructor affiliation requests. Approval verifies affiliation only; it does not grant an instructor role.</p>
      </div>
      <a class="tm-btn tm-btn-secondary" href="/">Home</a>
    </header>

    <section class="tm-panel" aria-labelledby="queue-heading">
      <div class="admin-toolbar">
        <div>
          <h2 id="queue-heading">Review queue</h2>
          <p id="admin-status" role="status" aria-live="polite">Loading pending requests…</p>
        </div>
        <label for="queue-status">Status
          <select id="queue-status" class="tm-select">
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <button id="refresh-queue" class="tm-btn tm-btn-secondary" type="button">Refresh</button>
      </div>
      <div id="verification-queue" class="admin-queue" aria-live="polite"></div>
    </section>
  </main>

  </script>
  <script src="/auth.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
