<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Workspace - TorqueMind</title>

  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/theme/layout.css">
  <link rel="stylesheet" href="/theme/dashboard.css">
  <link rel="stylesheet" href="/dashboard/student/student.css">

<body>

  <main class="tm-main wrapper">
    <p class="tm-eyebrow">Student Workspace</p>

    <nav class="tm-filter-toolbar" aria-label="Student workspace navigation">
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/">Scenarios</a>
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/transcript/">Transcript</a>

      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/activity/">Activity</a>
    </nav>

    <section class="tm-panel" aria-labelledby="coach-heading">
      <div class="tm-toolbar">
        <div>
          <h2 id="coach-heading">Recommended practice</h2>
          <p id="coachStatus" role="status" aria-live="polite">Loading recommendations…</p>

        <button id="coachRefresh" class="tm-btn tm-btn-secondary" type="button">Refresh</button>
      </div>
      <div id="coachRecommendations" class="tm-card-grid"></div>
      <p id="coachContext">

      </p>
    </section>
