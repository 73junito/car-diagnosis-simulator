<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Workspace - TorqueMind</title>

  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/theme/layout.css">
  <link rel="stylesheet" href="/theme/dashboard.css">
  <link rel="stylesheet" href="/dashboard/student/student.css">
</head>
<body>
  <div data-theme-shell></div>

  <main class="tm-main wrapper">
    <p class="tm-eyebrow">Student Workspace</p>
    <h1 id="moduleTitle">My Transcript</h1>

    <nav class="tm-filter-toolbar" aria-label="Student workspace navigation">
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/">Scenarios</a>
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/transcript/">Transcript</a>
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/learning-path/">Learning Path</a>
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/coach/">Coach</a>
      <a class="tm-btn tm-btn-secondary" href="/dashboard/student/activity/">Activity</a>
    </nav>

    <section id="moduleContent" class="dashboard-card"><div class="tm-transcript-card__grid">
  <article>
    <span>Completed</span>
    <strong id="completedCount">0</strong>
    <small>Scenarios finished</small>
  </article>
  <article>
    <span>Average Score</span>
    <strong id="averageScore">--</strong>
    <small>Pending submissions</small>
  </article>
  <article>
    <span>Certificates</span>
    <strong id="certificateCount">0</strong>
    <small>Earned credentials</small>
  </article>
  <article>
    <span>Training Hours</span>
    <strong id="trainingHours">0.0</strong>
    <small>Total practice time</small>
  </article>
</div></section>
  </main>

  <script type="module">
    import { mountShell } from "/theme/shell.js";
    mountShell();
  </script>
</body>
</html>
