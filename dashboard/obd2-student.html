<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OBD-II Student Diagnostic Workflow</title>
  <link rel="stylesheet" href="/dashboard/obd2-student.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="TorqueMind">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TorqueMind">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  <main class="student-workflow">
    <header>
      <h1>Student Diagnostic Workflow</h1>
      <div class="controls">
        <label for="scenario-select">Scenario</label>
        <select id="scenario-select"></select>
      </div>
    </header>

    <section class="symptoms">
      <h2>Symptom Review</h2>
      <textarea id="symptom-text" placeholder="Describe observed symptoms"></textarea>
    </section>

    <section class="tests">
      <h2>Test Selection</h2>
      <ul id="test-checklist" class="test-checklist"></ul>
    </section>

    <section class="diagnosis">
      <h2>Diagnosis</h2>
      <input id="diagnosis-input" placeholder="Enter your diagnosis" />
      <button id="submit-diagnosis">Submit Diagnosis</button>
      <div id="diagnosis-feedback" class="feedback" aria-live="polite">No submission yet.</div>
      <div id="score-summary" class="score-summary" aria-live="polite" hidden>
        <div id="score-value">Score: --</div>
        <div id="score-breakdown"></div>
        <div id="score-state"></div>
      </div>
    </section>
  </main>
  <script src="/data/scenarios.js"></script>
<script src="/data/scenario-registry.js"></script>
<script src="/dashboard/obd2-student.js"></script>
</body>
</html>
