<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Session - Instructor</title>
  <link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/theme/tokens.css" />
<link rel="stylesheet" href="/theme/layout.css" />
<link rel="stylesheet" href="/theme/dashboard.css" />
  <link rel="stylesheet" href="./live-session.css" />
</head>
<body>
  <main class="container tm-main">
    <section class="tm-hero-banner">
  <div>
    <p class="tm-hero-banner__eyebrow">Instructor Tools</p>
    <h1 class="tm-hero-banner__title">Live Session</h1>
    <p class="tm-hero-banner__subtitle">Monitor live learner activity, session events, and classroom progress in real time.</p>
  </div>
  <div class="tm-hero-banner__actions">
        <span id="conn-status" class="tm-pill">Disconnected</span>
        <button id="reconnect" class="tm-btn tm-btn-secondary">Reconnect</button>
        <button id="clear-feed" class="tm-btn tm-btn-secondary">Clear</button>
      </div></section>

    <section id="live-summary" class="tm-panel">
      <div><strong>Active sessions:</strong> <span id="active-sessions">0</span></div>
      <div><strong>Last event:</strong> <span id="last-event">—</span></div>
    </section>

    <section id="live-feed" class="tm-panel">
      <h2>Event Feed</h2>
      <ul id="event-list" class="live-list"></ul>
    </section>

  </main>

  <script src="./live-session.js"></script>
</body>
</html>
