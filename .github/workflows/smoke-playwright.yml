name: Playwright Smoke — Student Dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  student-dashboard-smoke:
    name: student-dashboard-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start static server
        run: |
          npx http-server -p 3003 -c-1 . > server.log 2>&1 &
        shell: bash

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3003

      - name: Run dashboard smoke tests
        env:
          BASE_URL: http://127.0.0.1:3003
        run: |
          npx playwright test tests/playwright/student-dashboard-smoke.spec.js -g smoke --output=playwright-report

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-logs
          path: server.log

      - name: Upload junit/test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
