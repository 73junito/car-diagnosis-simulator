name: LMF Release Evidence Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/lmf/release-evidence.json'
      - 'scripts/check-lmf-release-gates.cjs'
      - 'tests/lmf-release-gates.test.js'
      - 'docs/lmf-release-gates.md'
      - '.github/workflows/lmf-release-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test gate invariants
        run: node --test tests/lmf-release-gates.test.js
      - name: Require validated release evidence
        run: node scripts/check-lmf-release-gates.cjs
