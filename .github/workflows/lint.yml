name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies with bounded diagnostics
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          echo "::group::Runner and npm environment"
          node --version
          npm --version
          echo "::endgroup::"
          # Keep dependency lifecycle scripts enabled; enforce bounded install and diagnostics consistently with PR #1084.
          timeout --signal=TERM --kill-after=20s 12m npm ci --foreground-scripts --loglevel=info
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::npm ci failed or exceeded 12 minutes (exit $status); lint was not executed"
            echo "::group::Remaining process snapshot"
            ps -eo pid,ppid,stat,etime,args --sort=ppid | head -100
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0
