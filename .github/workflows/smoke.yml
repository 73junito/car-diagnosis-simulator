name: Auth-aware API Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

# Note: consider pinning actions to specific commit SHAs for increased security.
# e.g. replace uses: actions/checkout@v4 with uses: actions/checkout@<COMMIT_SHA>

jobs:
  smoke:
    name: smoke
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Debug workspace
        if: always()
        shell: pwsh
        run: |
          Get-Location
          Get-ChildItem -Force
          Get-ChildItem .github/workflows -Force
          node --version
          npm --version

      - name: Install dependencies (root)
        run: npm ci

      - name: Validate scenarios
        id: validate-scenarios
        run: npm run validate:scenarios
        continue-on-error: true

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json

      - name: Fail if scenario validation failed
        if: steps.validate-scenarios.outcome == 'failure'
        run: exit 1

      - name: Install API dependencies
        working-directory: torquemind-api
        run: npm ci

      - name: Start API server
        working-directory: torquemind-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          nohup npm start >/tmp/torquemind.log 2>&1 &
          echo "Server starting..."

      - name: Wait for API
        working-directory: torquemind-api
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API failed to start"
          cat /tmp/torquemind.log || true
          exit 1

      - name: Show API startup log
        run: |
          echo "----- API LOG -----"
          cat /tmp/torquemind.log || true
          echo "-------------------"

      - name: Run auth-aware smoke test
        working-directory: torquemind-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          BASE_URL: http://localhost:3000
        run: npm run test:smoke

      - name: Show API runtime log
        if: always()
        run: |
          echo "----- API RUNTIME LOG -----"
          cat /tmp/torquemind.log || true
          echo "---------------------------"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            reports/**
            torquemind-api/reports/**

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/**
            torquemind-api/coverage/**
