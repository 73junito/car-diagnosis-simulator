name: One-off fix exam Workers Builds configuration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-exam-workers-builds.yml"

permissions:
  contents: read

jobs:
  fix-exam-builds:
    if: github.repository == '73junito/car-diagnosis-simulator' && github.head_ref == 'ops/fix-exam-builds-config'
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 0257b4518015b64bd28bca05b803de27
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CF_TOKEN_AI: ${{ secrets.WORKERS_AI_API_TOKEN }}
      CF_TOKEN_WRANGLER: ${{ secrets.WRANGLER }}
    steps:
      - name: Patch and verify exam Workers Builds triggers
        shell: bash
        run: |
          set -euo pipefail

          token=""
          token_label=""
          for label in WORKERS_AI_API_TOKEN WRANGLER; do
            if [ "$label" = "WORKERS_AI_API_TOKEN" ]; then candidate="${CF_TOKEN_AI:-}"; else candidate="${CF_TOKEN_WRANGLER:-}"; fi
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /tmp/build-tokens.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" \
              "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/tokens")"
            if [ "$code" = "200" ] && jq -e '.success == true' /tmp/build-tokens.json >/dev/null 2>&1; then
              token="$candidate"
              token_label="$label"
              break
            fi
            echo "$label cannot access Workers Builds configuration API (HTTP $code)."
          done

          test -n "$token" || { echo "No repository secret has Workers Builds API access."; exit 1; }
          echo "Using $token_label for Workers Builds API."

          scripts="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/workers/scripts")"
          tag="$(jq -r '.result[] | select(.id=="autolearnpro-exam") | .tag // empty' <<<"$scripts")"
          test -n "$tag" || { echo "$token_label lacks Workers Scripts Read or exam Worker tag is unavailable."; exit 1; }
          echo "Resolved autolearnpro-exam immutable Worker tag."

          triggers="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/workers/$tag/triggers")"

          mapfile -t prod_ids < <(jq -r '.result[] | select((.branch_includes // []) | index("main")) | .trigger_uuid' <<<"$triggers")
          mapfile -t preview_ids < <(jq -r '.result[] | select(((.branch_includes // []) | index("*")) and ((.branch_excludes // []) | index("main"))) | .trigger_uuid' <<<"$triggers")

          test "${#prod_ids[@]}" -eq 1 || { echo "Expected one production trigger, found ${#prod_ids[@]}"; exit 1; }
          test "${#preview_ids[@]}" -eq 1 || { echo "Expected one preview trigger, found ${#preview_ids[@]}"; exit 1; }

          prod="${prod_ids[0]}"
          preview="${preview_ids[0]}"

          curl --fail-with-body -sS -o /tmp/prod.json \
            -X PATCH \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"build_command":"npm run exam:prepare","deploy_command":"npx wrangler deploy --config wrangler.exam.jsonc","root_directory":"/"}' \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/triggers/$prod"

          curl --fail-with-body -sS -o /tmp/preview.json \
            -X PATCH \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"build_command":"npm run exam:prepare","deploy_command":"npx wrangler preview --config wrangler.exam.jsonc","root_directory":"/"}' \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/triggers/$preview"

          jq -e '.success == true' /tmp/prod.json >/dev/null
          jq -e '.success == true' /tmp/preview.json >/dev/null

          verify="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/workers/$tag/triggers")"

          jq -e '
            [.result[] |
              select((.branch_includes // []) | index("main")) |
              select(.build_command == "npm run exam:prepare") |
              select(.deploy_command == "npx wrangler deploy --config wrangler.exam.jsonc") |
              select(.root_directory == "/")
            ] | length == 1
          ' <<<"$verify" >/dev/null

          jq -e '
            [.result[] |
              select(((.branch_includes // []) | index("*")) and ((.branch_excludes // []) | index("main"))) |
              select(.build_command == "npm run exam:prepare") |
              select(.deploy_command == "npx wrangler preview --config wrangler.exam.jsonc") |
              select(.root_directory == "/")
            ] | length == 1
          ' <<<"$verify" >/dev/null

          echo "Persisted configuration verified:"
          jq -r '.result[] | [.trigger_name,.build_command,.deploy_command,.root_directory,((.branch_includes // [])|join(",")),((.branch_excludes // [])|join(","))] | @tsv' <<<"$verify"
