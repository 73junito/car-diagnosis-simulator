name: One-off fix exam Workers Builds configuration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-exam-workers-builds.yml"

permissions:
  contents: read

jobs:
  fix-exam-builds:
    if: github.repository == '73junito/car-diagnosis-simulator' && github.head_ref == 'ops/fix-exam-builds-config'
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 0257b4518015b64bd28bca05b803de27
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CF_TOKEN_AI: ${{ secrets.WORKERS_AI_API_TOKEN }}
      CF_TOKEN_WRANGLER: ${{ secrets.WRANGLER }}
    steps:
      - name: Patch production trigger and verify preview configuration
        shell: bash
        run: |
          set -euo pipefail

          token=""
          token_label=""
          for label in WORKERS_AI_API_TOKEN WRANGLER; do
            if [ "$label" = "WORKERS_AI_API_TOKEN" ]; then candidate="${CF_TOKEN_AI:-}"; else candidate="${CF_TOKEN_WRANGLER:-}"; fi
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /tmp/build-tokens.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" \
              "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/tokens")"
            if [ "$code" = "200" ] && jq -e '.success == true' /tmp/build-tokens.json >/dev/null 2>&1; then
              token="$candidate"
              token_label="$label"
              break
            fi
          done
          test -n "$token" || { echo "No repository secret has Workers Builds API access."; exit 1; }
          echo "Using $token_label for Workers Builds API."

          # Known main-branch exam build and fresh preview build provide the current
          # production Worker tag and the effective Preview build configuration.
          prod_build="eef96dea-036b-4646-842f-6bc11498b242"
          preview_build="25313a05-e7a9-432c-8991-d84ad939297e"

          prod_record="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/builds/$prod_build")"
          preview_record="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/builds/$preview_build")"

          prod_tag="$(jq -r '.result.trigger.external_script_id // empty' <<<"$prod_record")"
          test -n "$prod_tag" || { echo "Production exam Worker tag unavailable."; exit 1; }

          echo "Effective Preview build configuration:"
          jq -r '.result.trigger | [.trigger_name,.build_command,.deploy_command,.root_directory,((.branch_includes // [])|join(","))] | @tsv' <<<"$preview_record"
          jq -e '.result.trigger.build_command == "npm run exam:prepare"' <<<"$preview_record" >/dev/null
          jq -e '.result.trigger.deploy_command == "npx wrangler preview --config wrangler.exam.jsonc"' <<<"$preview_record" >/dev/null
          jq -e '.result.trigger.root_directory == "/"' <<<"$preview_record" >/dev/null
          echo "Preview command configuration is already deterministic."

          prod_triggers="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $token" \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/workers/$prod_tag/triggers")"
          echo "Current production trigger metadata:"
          jq -r '.result[] | [.trigger_uuid,.trigger_name,.build_command,.deploy_command,.root_directory,((.branch_includes // [])|join(",")),((.branch_excludes // [])|join(","))] | @tsv' <<<"$prod_triggers"

          mapfile -t prod_ids < <(jq -r '.result[] | select((.branch_includes // []) | index("main")) | .trigger_uuid' <<<"$prod_triggers")
          test "${#prod_ids[@]}" -eq 1 || { echo "Expected one production trigger, found ${#prod_ids[@]}"; exit 1; }
          prod="${prod_ids[0]}"

          curl --fail-with-body -sS -o /tmp/prod.json \
            -X PATCH \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"build_command":"npm run exam:prepare","deploy_command":"npx wrangler deploy --config wrangler.exam.jsonc","root_directory":"/"}' \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/triggers/$prod"

          jq -e '.success == true and .result.build_command == "npm run exam:prepare" and .result.deploy_command == "npx wrangler deploy --config wrangler.exam.jsonc" and .result.root_directory == "/"' /tmp/prod.json >/dev/null
          echo "Persisted production trigger:"
          jq -r '.result | [.trigger_name,.build_command,.deploy_command,.root_directory,((.branch_includes // [])|join(",")),((.branch_excludes // [])|join(","))] | @tsv' /tmp/prod.json

          start="$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"branch":"main"}' \
            "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/triggers/$prod/builds")"
          jq -e '.success == true' <<<"$start" >/dev/null
          build_uuid="$(jq -r '.result.build_uuid // empty' <<<"$start")"
          test -n "$build_uuid" || { echo "Production validation build UUID unavailable."; exit 1; }
          echo "Started production validation build $build_uuid."

          for attempt in $(seq 1 60); do
            current="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $token" \
              "${CF_API_BASE}/accounts/${CF_ACCOUNT_ID}/builds/builds/$build_uuid")"
            status="$(jq -r '.result.status // empty' <<<"$current")"
            outcome="$(jq -r '.result.build_outcome // empty' <<<"$current")"
            echo "Validation build: status=$status outcome=$outcome"
            if [ "$status" = "stopped" ]; then
              jq -e '.result.build_trigger_metadata.build_command == "npm run exam:prepare"' <<<"$current" >/dev/null
              jq -e '.result.build_trigger_metadata.deploy_command == "npx wrangler deploy --config wrangler.exam.jsonc"' <<<"$current" >/dev/null
              test "$outcome" = "success" || { echo "Production validation build did not succeed."; exit 1; }
              echo "Production validation build succeeded with deterministic exam commands."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for production validation build."
          exit 1
