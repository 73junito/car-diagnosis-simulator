name: Append Runs History

# workflow-dispatch enabled for programmatic triggers
on:
  push:
    paths:
      - 'runs/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  append-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure history file
        run: |
          set -e
          mkdir -p runs
          if [ ! -f runs/history.csv ]; then
            echo "accepted,denied,acceptRate,completed,avgDuration,p50,p90,p99,notificationAttempts,totalLogs,generatedAt,source" > runs/history.csv
            # Leave the new file uncommitted; if appends occur later the
            # create-pull-request step will commit the header and appended rows
            echo "Created runs/history.csv header (uncommitted)"
          fi

      - id: append-summary
        name: Append history row from run-scheduled-summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          appended=0
          SUMMARY=runs/run-scheduled-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No summary file found; skipping history append."
            echo "appended=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "const fs=require('fs'); const p=process.env.SUMMARY||'runs/run-scheduled-summary.json'; const s=JSON.parse(fs.readFileSync(p)); const results=s.results||[]; const total=results.length; const accepted=results.filter(r=>r.ok).length; const denied=results.filter(r=>!r.ok).length; const lat=results.map(r=>r.latency||0).filter(n=>typeof n==='number'); const avg=Math.round(lat.length? lat.reduce((a,b)=>a+b,0)/lat.length:0); const sorted=lat.slice().sort((a,b)=>a-b); const pct=(n,k)=>{ if(!n.length) return 0; const i=Math.floor(k*(n.length-1)); return Math.round(n[i]||0); }; const p50=pct(sorted,0.5); const p90=pct(sorted,0.9); const p99=pct(sorted,0.99); const notif=0; const totalLogs=0; const gen=new Date().toISOString(); const acceptRate=(accepted+denied)? (accepted/(accepted+denied)).toFixed(2):'0'; const row=[accepted,denied,acceptRate,total,avg,p50,p90,p99,notif,totalLogs,gen,'run-scheduled-summary.json'].join(','); fs.appendFileSync('runs/history.csv', row+"\n"); console.log('APPENDED:'+row); process.stdout.write('appended=1');" > tmp_out.txt
          # propagate appended flag to GitHub actions
          if grep -q '^APPENDED:' tmp_out.txt; then
            echo "appended=1" >> "$GITHUB_OUTPUT"
          else
            echo "appended=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for runs/history.csv updates
        if: steps.append-summary.outputs.appended == '1'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: append runs/history.csv from scheduled harness
          title: chore: update runs/history.csv (scheduled harness)
          body: |-
            This PR was opened automatically by the scheduled harness run to append a new row to `runs/history.csv`.
          branch: history/update-${{ github.run_id }}
          labels: runs-history
          delete-branch: true

      - name: Upload runs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runs-artifacts
          path: |
            runs/digest-tuned-extended.json
            runs/plot-ready-tuned.json
            runs/dashboard-*.csv
            runs/combined-requests-tuned.csv
            runs/accepted-requests-tuned.csv
            runs/denied-requests-tuned.csv
            runs/vercel-raw-tuned.txt
            runs/vercel-filtered-tuned.json
            runs/vercel-fullfiltered-tuned.json
