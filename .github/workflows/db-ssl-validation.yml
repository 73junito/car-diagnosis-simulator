name: DB SSL validation (manual)

on:
  workflow_dispatch:
    inputs:
      run-db-ssl:
        description: 'Set to "true" to run DB SSL validation (keeps workflow manual/optional)'
        required: false
        default: 'false'

# Note: consider pinning actions to specific commit SHAs for increased security.
# e.g. replace uses: actions/checkout@v4 with uses: actions/checkout@<COMMIT_SHA>

jobs:
  db-ssl-validation:
    if: "${{ github.event.inputs.run-db-ssl == 'true' }}"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: torquemind-api/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          cd torquemind-api
          npm ci

      - name: Validate DB SSL configuration
        shell: pwsh
        continue-on-error: true
        run: |
          cd torquemind-api
          ./scripts/validate-db-ssl.ps1 -Ci -Quiet

      - name: Check for DB SSL report
        id: report
        shell: pwsh
        run: |
          if (Test-Path "torquemind-api/reports/db-ssl-validation-report.json") {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload DB SSL validation report
        if: always() && steps.report.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-ssl-validation-report
          path: torquemind-api/reports/db-ssl-validation-report.json

      - name: Validate DB SSL report schema
        if: always() && steps.report.outputs.exists == 'true'
        working-directory: torquemind-api
        run: npm run db:validate-report
