name: Map native draft evidence

on:
  workflow_dispatch:
    inputs:
      scenario_id:
        description: Scenario question-bank ID of the private native draft
        required: true
        default: charging-system
        type: string
      governed_run_id:
        description: "Governed run ID created by draft creation (native-draft:<run_id>:<scenario>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-evidence-mapping-${{ inputs.governed_run_id }}
  cancel-in-progress: false

jobs:
  map-evidence:
    name: Bind private draft to governed evidence and advance to evidence_mapped
    runs-on: ubuntu-latest
    environment: pffdgqpynpbffbcnxmum_production
    timeout-minutes: 5
    env:
      TORQUEMIND_ENVIRONMENT: production
      TORQUEMIND_ORCHESTRATION_PERSISTENCE: supabase
      TORQUEMIND_ORCHESTRATION_SUPABASE_PROJECT_REF: pffdgqpynpbffbcnxmum
      SUPABASE_URL: https://pffdgqpynpbffbcnxmum.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Validate production secret and inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Environment secret SERVICE_ROLE_KEY is not configured"
            exit 1
          fi
          if [[ ! "${{ inputs.scenario_id }}" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid scenario_id"
            exit 1
          fi
          if [[ ! "${{ inputs.governed_run_id }}" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "Invalid governed_run_id"
            exit 1
          fi

      - name: Map evidence and record governed transition
        shell: bash
        run: |
          node scripts/map-native-question-evidence.js \
            --scenario="${{ inputs.scenario_id }}" \
            --run-id="${{ inputs.governed_run_id }}"

      - name: Governance notice
        shell: bash
        run: |
          echo "The answer-bearing draft payload remains service-role-only in native_governed_question_drafts."
          echo "The semantic question is not inserted into public scenario_questions."
          echo "Only question_citations rows and the drafted to evidence_mapped ledger entry were created."
          echo "No technical review, instructional review, human approval, assessment eligibility, scored delivery, API eligibility, or release authority was created."
