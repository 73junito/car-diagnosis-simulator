name: Configure branch protection

on:
  workflow_dispatch:

jobs:
  protect-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check inputs
        run: |
          echo 'Applying branch protection to "main" with required checks: unit-tests, build-and-test (22), build-and-test (24), Run ESLint, api-smoke'

      # Required contexts must match the exact check-run names GitHub publishes.
      # Matrix jobs append their matrix values to the job id, so the
      # `build-and-test` job in .github/workflows/ci.yml
      # (strategy.matrix.node-version: ['22', '24']) reports as
      # "build-and-test (22)" and "build-and-test (24)" and never as the bare
      # "build-and-test". Keep the list below in sync if that matrix changes.
      - name: Create payload
        run: |
          cat > payload.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "unit-tests",
                "build-and-test (22)",
                "build-and-test (24)",
                "Run ESLint",
                "api-smoke"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_deletions": false,
            "allow_force_pushes": false
          }
          JSON

      - name: Apply branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/branches/main/protection \
            -d @payload.json

      - name: Confirm
        run: echo "Branch protection request sent. Verify in repository settings or via GitHub API."
