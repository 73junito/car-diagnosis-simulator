name: Sensor Lab Ollama API verification

on:
  workflow_dispatch:
    inputs:
      target_count:
        description: Number of Sensor Lab draft questions to request (1-20)
        required: true
        default: '10'
        type: string
      model:
        description: Ollama Cloud model
        required: true
        default: gpt-oss:20b
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate project-authored Sensor Lab drafts
    runs-on: ubuntu-latest
    environment: ollama
    timeout-minutes: 10
    env:
      OLLAMA_API_KEY: ${{ secrets.API_GITHUB }}
      OLLAMA_API_URL: https://ollama.com/api/chat

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate task without API call
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.target_count }}" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            echo "target_count must be 1-20"
            exit 1
          fi
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo "Environment secret API_GITHUB is not configured"
            exit 1
          fi
          node scripts/generate-sensor-lab-question-drafts.js             --target="${{ inputs.target_count }}"             --model="${{ inputs.model }}"             --dry-run=true

      - name: Send governed Sensor Lab task to Ollama Cloud
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-lab-ollama"
          node scripts/generate-sensor-lab-question-drafts.js             --target="${{ inputs.target_count }}"             --model="${{ inputs.model }}"             --output="$RUNNER_TEMP/sensor-lab-ollama/sensor-lab-question-drafts.json"

      - name: Verify completed draft artifact
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.RUNNER_TEMP + '/sensor-lab-ollama/sensor-lab-question-drafts.json';
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (doc.task_status !== 'completed') throw new Error('Ollama task did not complete.');
          if (doc.verification_status !== 'pending-human-review') throw new Error('Human verification boundary missing.');
          if (doc.governance.auto_approval !== false) throw new Error('Auto-approval boundary failed.');
          if (doc.governance.auto_database_write !== false) throw new Error('Database-write boundary failed.');
          if (!Array.isArray(doc.questions) || doc.questions.length !== Number('${{ inputs.target_count }}')) {
            throw new Error('Question count mismatch.');
          }
          console.log('OLLAMA_RESPONSE_VERIFIED=completed');
          console.log('DRAFT_COUNT=' + doc.questions.length);
          NODE

      - name: Upload completed Ollama task for human verification
        uses: actions/upload-artifact@v7
        with:
          name: "sensor-lab-ollama-verification-${{ github.run_id }}"
          path: ${{ runner.temp }}/sensor-lab-ollama/sensor-lab-question-drafts.json
          if-no-files-found: error
          retention-days: 14

      - name: Governance notice
        shell: bash
        run: |
          echo "Ollama task status: completed."
          echo "Output is draft-only and pending human verification."
          echo "Only project-authored Sensor Lab runtime/template facts were sent."
          echo "No third-party source text, database write, scoring change, assessment eligibility, or automatic approval occurred."
