name: API Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Note: consider pinning actions to specific commit SHAs for increased security.
# e.g. replace uses: actions/checkout@v4 with uses: actions/checkout@<COMMIT_SHA>

jobs:
  smoke:
    name: api-smoke
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
      TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Debug workspace
        if: always()
        shell: pwsh
        run: |
          Get-Location
          Get-ChildItem -Force
          Get-ChildItem .github/workflows -Force
          node --version
          npm --version

      - name: Install dependencies (root)
        run: npm ci

      - name: Validate scenarios
        id: validate-scenarios
        run: npm run validate:scenarios
        continue-on-error: true

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json

      - name: Fail if scenario validation failed
        if: steps.validate-scenarios.outcome == 'failure'
        run: exit 1

      - name: Install dependencies (torquemind-api)
        working-directory: torquemind-api
        run: npm ci

      - name: Start API server and wait
        working-directory: torquemind-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # start server in background and record pid/log
          nohup npm start >/tmp/torquemind.log 2>&1 &
          echo $! > /tmp/torquemind.pid || true
          sleep 1
          if [ -s /tmp/torquemind.log ]; then echo "server log created"; fi

          # Poll for readiness, also check process and listening port
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            if [ -f /tmp/torquemind.pid ]; then
              if ! ps -p $(cat /tmp/torquemind.pid) >/dev/null 2>&1; then
                echo "Background process not running"
                break
              fi
            fi
            # show if port listened (best-effort)
            ss -lnt 2>/dev/null | grep -q ':3000' && echo "port 3000 listening" || true
            sleep 2
          done

          echo "API failed to start; dumping /tmp/torquemind.log:"
          sed -n '1,200p' /tmp/torquemind.log || true
          exit 1

      - name: Run smoke test (with retries)
        working-directory: torquemind-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          BASE_URL: http://localhost:3000
        run: |
          max_attempts=3
          attempt=1
          until npm run test:smoke; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Smoke test failed after $attempt attempts."
              exit 1
            fi
            echo "Smoke test failed on attempt $attempt. Retrying in 10 seconds..."
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Show server log (after tests)
        if: always()
        run: |
          echo "--- /tmp/torquemind.log (after tests) ---"
          tail -n +1 /tmp/torquemind.log || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            reports/**
            torquemind-api/reports/**

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/**
            torquemind-api/coverage/**
