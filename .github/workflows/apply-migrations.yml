name: Apply DB Migrations (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only the scopes the executable steps need. `pages: write` and `id-token: write`
# were removed: this workflow triggers only on pull_request, so the Pages
# publishing steps are unreachable, while the test job checks out and runs
# pull-request code. tests/disposable-migration-validation.test.js guards this.
permissions:
  contents: read
  pull-requests: write

jobs:
  apply-migrations:
    name: Apply migrations against disposable Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Least privilege, scoped to this job. The workflow-level block above still
    # governs the reporting job; this job never writes to the pull request, so it
    # deliberately does not inherit `pull-requests: write`. `packages: read` is the
    # only addition, and it exists solely to authenticate the image pull below.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Validates the canonical chain (supabase/migrations) against the reviewed
      # digest-pinned Supabase PostgreSQL 17 image, which is the only runtime
      # that supplies the platform roles and `auth` schema the chain depends on.
      # See docs/database/migration-authority.md section 3.
      #
      # The container runs with no network, no published port and no host mount.
      # The script proves that isolation, waits for complete initialisation
      # (`pg_isready` alone is not sufficient), creates the documented *empty*
      # migration-bookkeeping relation, applies every migration with
      # `psql -v ON_ERROR_STOP=1` stopping at the first failure, verifies the
      # audited roles exist, then runs the grants audit. Migration history is
      # never written, no staging or production credential is present, and the
      # container is removed at the end.
      # ghcr.io rate-limits anonymous pulls with a burst limiter, which surfaces
      # as `toomanyrequests: retry-after: ...` and fails this job in ~6 s before
      # a single migration is applied (observed twice on run 39841045927, while
      # the identical job passed on another PR at the same time).
      #
      # The image is resolved from the harness's own exported constant, so the
      # digest has exactly one source of truth and cannot drift between this
      # step and the validator. The pull is bounded and lives entirely outside
      # the validator: the validator keeps its digest pin, its ON_ERROR_STOP and
      # its fail-closed behaviour unchanged.
      - name: Resolve the pinned migration image
        id: migration-image
        run: |
          set -euo pipefail
          image=$(node -e "process.stdout.write(require('./scripts/lib/disposable-migration-container').APPROVED_SUPABASE_IMAGE)")
          test -n "$image" || { echo 'BLOCKED: could not resolve the approved migration image.'; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Best-effort authentication, added after manual diagnostic run 39892068108
      # showed that this repository's GITHUB_TOKEN can authenticate to ghcr.io and
      # pull this exact digest.
      #
      # A successful login only proves that credentials were configured for the
      # pull that follows. It does not prove that authentication caused that pull to
      # succeed, nor that it removes the shared runner's anonymous rate limiting.
      # The step is therefore deliberately *not* fail-closed: it reports which path
      # was taken and leaves the anonymous attempt available. Only the pull itself
      # fails closed.
      #
      # Fork-origin pull requests do not receive `packages: read`, so login is
      # expected to fail there. That must not fail the job, or a fork pull request
      # would lose the anonymous attempt that currently works.
      - name: Authenticate to ghcr.io (best effort)
        id: ghcr-auth
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin > /tmp/ghcr-login.out 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "ghcr-auth status: anonymous-fallback"
            echo "::warning::ghcr.io authentication failed (rc=$rc); continuing with an anonymous pull."
            echo "matched_signals:"
            grep -Eio 'unauthorized|denied|forbidden|authentication required|no basic auth credentials|not found|error|failed|cannot|timeout|connection refused|rate limit' /tmp/ghcr-login.out | tr '[:upper:]' '[:lower:]' | sort -u || echo "(none)"
            echo "(raw docker login output withheld: pattern redaction is not a guarantee)"
            rm -f /tmp/ghcr-login.out
            echo "status=anonymous-fallback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f /tmp/ghcr-login.out
          echo "ghcr-auth status: authenticated"
          echo "status=authenticated" >> "$GITHUB_OUTPUT"

      - name: Pre-pull the pinned migration image (bounded retry)
        timeout-minutes: 8
        env:
          IMAGE: ${{ steps.migration-image.outputs.image }}
          AUTH_STATUS: ${{ steps.ghcr-auth.outputs.status }}
        run: |
          set -euo pipefail
          echo "ghcr-auth status: ${AUTH_STATUS:-unknown}"
          for attempt in 1 2 3 4 5; do
            if docker pull "$IMAGE"; then
              echo "Pulled $IMAGE on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            delay=$(( 5 * (2 ** (attempt - 1)) ))
            echo "::warning::pull attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::could not pull $IMAGE after 5 bounded attempts."
          exit 1

      # Removes the credential stored by the login step. `always()` so it still runs
      # when the pull failed and the job is about to stop. `docker logout` only
      # deletes the stored credential and prints no secret. A non-zero logout is
      # annotated but does not fail the job: the runner is discarded either way, and
      # failing here would mask the real validation result.
      - name: Log out of ghcr.io
        if: always()
        run: |
          set -uo pipefail
          if ! docker logout ghcr.io; then
            echo "::warning::docker logout ghcr.io reported a non-zero status."
          fi

      - name: Validate canonical migrations against disposable Supabase Postgres
        run: node scripts/validate-migrations-disposable.js

  run-tests:
    name: Run full test suite
    needs: apply-migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      - name: Run tests (with retries)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          CI_TEST_RETRIES: 1
          CI_TEST_BACKOFF_MS: 2000
          CI_PER_TEST_RETRIES: 1
        run: |
          node scripts/ci-run-tests.js

      - name: Annotate failing tests
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Jest Tests
          path: test-results/junit.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-empty: false

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: test-results/junit.xml

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-html-report
          path: test-results/jest-report.html

      - name: Post PR test summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/post-junit-summary.js

      - name: Track flaky tests
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAKY_THRESHOLD: 3
        run: |
          node scripts/flaky-tracker.js

      - name: Upload flaky history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-history
          path: test-results/flaky-history.json

      - name: Detect slow tests
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOW_TEST_MS: 2000
          SLOW_TEST_TOP: 20
        run: |
          node scripts/slow-test-detector.js

      - name: Upload slow-tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-tests
          path: test-results/slow-tests.json

      - name: Slow-test trend alerts
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOW_TREND_LOOKBACK: 8
          SLOW_TREND_MIN_HISTORY: 3
          SLOW_TREND_PERCENT: 0.25
          SLOW_TREND_MIN_DELTA_MS: 200
        run: |
          node scripts/slow-test-trend-alerts.js

      - name: Auto-open regression issues
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LOOKBACK: 8
          ISSUE_MIN_OCCURRENCES: 3
        run: |
          node scripts/auto-open-regression-issues.js

      - name: Generate test dashboard (artifact)
        if: always()
        run: |
          node scripts/generate-dashboard.js

      - name: Fetch Chart.js for Pages bundle
        if: always()
        run: |
          mkdir -p test-results
          curl -fsSL -o test-results/chart.min.js https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js || echo "could not download chart.js"

      - name: Upload test dashboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-dashboard
          path: test-results/dashboard.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: test-results

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
