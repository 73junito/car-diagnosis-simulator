name: Trademark Policy Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trademark-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protected trademark policy
        run: node scripts/verify-prohibited-trademark-policy.js
