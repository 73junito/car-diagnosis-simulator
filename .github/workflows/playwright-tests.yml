name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite declares no Firefox or WebKit project:
      # playwright.config.js exposes `setup`, `chromium` and an optional
      # `public-chromium` (all Desktop Chrome), and
      # playwright.animation-review.config.js exposes `chromium` only.
      # Installing every engine makes `--with-deps` pull the WebKit/Firefox
      # multimedia dependency tree (GStreamer, libav, SDL, PipeWire, JACK),
      # which is what exhausted the job budget on run 39828013635.
      #
      # The two stages are split and separately bounded so that a slow apt
      # transaction or a slow browser download fails fast and names the stage
      # instead of consuming the whole job timeout.
      - name: Install Playwright OS dependencies (chromium)
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Install Playwright browser (chromium)
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Start static server
        run: |
          npx http-server -p 3003 -c-1 . > server.log 2>&1 &
        shell: bash

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3003

      - name: Run Playwright tests
        run: npm run test:playwright --silent

      - name: Validate animation human-review contract
        run: npm run validate:animation-human-review --silent

      - name: Validate animation promotion readiness
        run: npm run validate:animation-promotion-readiness --silent

      - name: Validate approved-question animation mapping
        run: npm run validate:question-animation-mapping --silent

      - name: Validate lab management framework foundation
        run: npm run validate:lmf-foundation --silent

      - name: Run animation review harness
        run: npm run test:animation-review-harness --silent

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload server logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-server-logs
          path: server.log
