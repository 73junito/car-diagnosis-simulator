name: record-native-question-final-approval

# Phase 10H design phase: this workflow declares no manual-dispatch event,
# so no dispatch entry exists in the Actions UI. The only trigger is a push
# of a governance-resolution tag pattern that does not exist yet, and every
# job step fails closed regardless, so no run can record anything.
on:
  push:
    tags:
      - 'phase10h-governance-resolved-*'

permissions:
  contents: read
  actions: read

# Policy:
# DO NOT mark this workflow dispatchable until:
#   FINAL_APPROVER_REQUIRED_ROLE is approved
#   FINAL_APPROVER_REQUIRED_SCOPE is approved
#   independentFromTechnicalReviewer is approved
#   independentFromInstructionalReviewer is approved
#   checklistVersion and checklistCriteria are approved
# This workflow intentionally fails closed and records nothing in production.

jobs:
  record-final-content-approval:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase10h-governance-resolved-')
    steps:
      - name: Require governance decisions before any run
        run: |
          echo "record-native-question-final-approval is non-dispatchable until the Phase 10H governance decisions are approved."
          exit 1

      - name: Fail closed validation
        run: |
          echo "Phase 10H workflow requires approved role, scope, independence rule, and checklist contract."
          exit 1
