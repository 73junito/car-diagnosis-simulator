name: Sync Semantic Scholar Worker Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-semantic-scholar-secret:
    name: Sync Semantic Scholar secret to Cloudflare
    runs-on: ubuntu-latest
    environment: Semantic_Scholar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER }}
        run: npx wrangler whoami

      - name: Validate required environment secret is present
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SEMANTIC_SCHOLAR_API_KEY:-}" ]; then
            echo "Semantic Scholar API_KEY environment secret is not configured."
            exit 1
          fi
          echo "Semantic Scholar environment secret is configured."

      - name: Sync Semantic Scholar API key to autolearnpro-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SEMANTIC_SCHOLAR_API_KEY" |
            npx wrangler secret put SEMANTIC_SCHOLAR_API_KEY --config wrangler.app.jsonc

      - name: Verify Worker secret binding name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.app.jsonc |
            grep -q '"name": "SEMANTIC_SCHOLAR_API_KEY"'
          echo "Cloudflare Worker secret binding is present."
