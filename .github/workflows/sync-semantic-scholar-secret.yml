name: Sync Semantic Scholar Worker Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-semantic-scholar-secret:
    name: Stage Semantic Scholar secret for Cloudflare deployment
    runs-on: ubuntu-latest
    environment: Semantic_Scholar
    permissions:
      contents: read
      actions: write

    steps:
      - name: Validate source environment secret is present
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SEMANTIC_SCHOLAR_API_KEY:-}" ]; then
            echo "Semantic Scholar API_KEY environment secret is not configured."
            exit 1
          fi
          echo "Semantic Scholar source secret is configured."

      - name: Copy secret into Cloudflare deployment environment
        env:
          GH_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gh secret set SEMANTIC_SCHOLAR_API_KEY \
            --repo "${{ github.repository }}" \
            --env autolearnpro_cloudflare \
            --body "$SEMANTIC_SCHOLAR_API_KEY"
          echo "Semantic Scholar secret staged for Cloudflare deployment."

  sync-semantic-scholar-secret:
    name: Sync Semantic Scholar secret to Cloudflare
    needs: stage-semantic-scholar-secret
    runs-on: ubuntu-latest
    environment: autolearnpro_cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify required deployment secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Cloudflare API_TOKEN is not configured."; exit 1; }
          test -n "${SEMANTIC_SCHOLAR_API_KEY:-}" || { echo "Staged Semantic Scholar secret is not configured."; exit 1; }
          echo "Required deployment secrets are configured."

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
        run: npx wrangler whoami

      - name: Sync Semantic Scholar API key to autolearnpro-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SEMANTIC_SCHOLAR_API_KEY" |
            npx wrangler secret put SEMANTIC_SCHOLAR_API_KEY --config wrangler.app.jsonc --env=""

      - name: Verify Worker secret binding name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.app.jsonc --env="" |
            grep -q '"name": "SEMANTIC_SCHOLAR_API_KEY"'
          echo "Cloudflare Worker secret binding is present."
