name: Cloudflare Preview Reconciliation

on:
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete only verified closed-PR previews (requires explicit true)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-preview-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    environment: autolearnpro_cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_READ_TOKEN_API }}
      CLOUDFLARE_ACCOUNT_ID: '0257b4518015b64bd28bca05b803de27'
      GITHUB_TOKEN: ${{ github.token }}
      PREVIEW_CLEANUP_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile previews (scheduled dry-run)
        run: node scripts/reconcile-cloudflare-previews.js

      - name: Audit live Worker previews (read-only sample)
        if: github.event_name == 'workflow_dispatch' && inputs.apply == false
        run: node scripts/audit-live-cloudflare-previews.js
