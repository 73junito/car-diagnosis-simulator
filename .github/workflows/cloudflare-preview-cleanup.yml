name: Cloudflare Preview Cleanup (Closed PR)

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-closed-pr-preview:
    # Never give Cloudflare credentials to forked PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: autolearnpro-app
          - worker: autolearnpro-exam
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve branch Preview name
        id: preview
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const branch = process.env.BRANCH || '';
          // Cloudflare's git-based preview naming uses a hyphenated branch slug.
          // Reject unexpected names rather than broadening the deletion target.
          if (!/^(feat|fix|chore|docs|test|ci|refactor|dependabot)\/[a-zA-Z0-9][a-zA-Z0-9._/-]*$/.test(branch))
            throw Error('Unrecognized preview branch; manual review required: ' + branch);
          const preview = branch.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
          if (!preview || preview === 'main' || preview === 'production' || preview.length > 100)
            throw Error('Unsafe preview name');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + preview + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Closed PR #' + process.env.PR_NUMBER +
            ': exact preview name `' + preview + '`\n');
          NODE
      - name: Delete exact closed-branch Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
          WORKER_NAME: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Target ONLY the named preview on this Worker, never a Worker delete.
          npx --yes wrangler@4.149.0 preview delete \
            --worker-name "$WORKER_NAME" \
            --name "$PREVIEW_NAME" --skip-confirmation
          echo "Deleted exact Preview \`$PREVIEW_NAME\` on \`$WORKER_NAME\`." >> "$GITHUB_STEP_SUMMARY"
