name: Cloudflare Preview Cleanup (Manual)

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker that owns the obsolete Preview
        required: true
        type: choice
        options:
          - autolearnpro-app
          - autolearnpro-exam
      preview_name:
        description: Exact Preview name confirmed in Cloudflare
        required: true
        type: string
      confirm:
        description: Type DELETE-OBSOLETE-PREVIEW to acknowledge irreversible Preview storage deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-confirmed-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-preview-cleanup
    steps:
      - name: Validate explicit target
        env:
          WORKER: ${{ inputs.worker }}
          PREVIEW: ${{ inputs.preview_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node - <<'NODE'
          const {WORKER, PREVIEW, CONFIRM} = process.env;
          if (!['autolearnpro-app','autolearnpro-exam'].includes(WORKER)) throw Error('Unapproved Worker');
          if (!/^[a-z0-9][a-z0-9-]{0,99}$/.test(PREVIEW) || ['main','production','prod'].includes(PREVIEW)) throw Error('Unsafe Preview name');
          if (CONFIRM !== 'DELETE-OBSOLETE-PREVIEW') throw Error('Explicit confirmation required');
          NODE
      - name: Delete one exact Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW: ${{ inputs.preview_name }}
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.149.0 preview delete --worker-name "$WORKER" --name "$PREVIEW" --skip-confirmation
          echo "Deleted explicit Preview \`$PREVIEW\` for \`$WORKER\`." >> "$GITHUB_STEP_SUMMARY"
