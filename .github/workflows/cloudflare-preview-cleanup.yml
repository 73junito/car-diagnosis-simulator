name: Cloudflare Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-autolearnpro-app-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER }}
      CLOUDFLARE_ACCOUNT_ID: 0257b4518015b64bd28bca05b803de27
      PREVIEW_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Delete closed PR Preview
        run: >
          npx wrangler preview delete
          --name "$PREVIEW_NAME"
          --worker-name autolearnpro-app
          --skip-confirmation
          --config wrangler.app.jsonc
