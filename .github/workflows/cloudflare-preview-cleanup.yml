name: Cloudflare Preview Closure Notice

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  report-closed-pr-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report preview retention (no deletion)
        env:
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          {
            echo '## Cloudflare Preview Retained'
            echo
            echo "PR #${PR_NUMBER} closed (merged: ${PR_MERGED})."
            echo "Branch: \`${PREVIEW_BRANCH}\`"
            echo
            echo 'This workflow does not delete or modify Cloudflare previews.'
            echo 'Use the read-only Cloudflare preview audit for lifecycle verification.'
          } >> "$GITHUB_STEP_SUMMARY"
