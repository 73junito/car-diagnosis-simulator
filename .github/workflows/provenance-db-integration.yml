name: Provenance Database Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/test-provenance-db.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/provenance-db-integration.yml"
      - "package.json"
      - "package-lock.json"

  push:
    branches:
      - main
    paths:
      - "scripts/test-provenance-db.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/provenance-db-integration.yml"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

jobs:
  provenance-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          echo 'Waiting for Postgres to be ready...'
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done

      - name: Run provenance DB integration tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: testdb
        run: node scripts/test-provenance-db.js
