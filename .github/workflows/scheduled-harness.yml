name: Scheduled Harness Run

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Check HARNESS_URL secret
        env:
          HARNESS_URL: ${{ secrets.HARNESS_URL }}
        run: |
          if [ -z "$HARNESS_URL" ]; then
            echo "Error: HARNESS_URL secret is not set."
            exit 1
          fi

      - name: Run non-mutating production harness
        env:
          HARNESS_URL: ${{ secrets.HARNESS_URL }}
        run: |
          mkdir -p runs
          node scripts/harness.js \
            --count 50 \
            --concurrency 3 \
            --rate 10 \
            --method GET \
            --path /api/curriculum \
            --min-success-rate 1 \
            --export runs/run-scheduled-latest.json \
            --url "$HARNESS_URL"

      - name: Build scheduled summary
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const source = 'runs/run-scheduled-latest.json'
          const run = JSON.parse(fs.readFileSync(source, 'utf8'))
          fs.writeFileSync(
            'runs/run-scheduled-summary.json',
            JSON.stringify({ results: run.results || [], count: (run.results || []).length }, null, 2)
          )
          NODE

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runs-artifacts
          path: |
            runs/run-scheduled-latest.json
            runs/run-scheduled-summary.json
          if-no-files-found: warn

      - name: Append successful run to history
        run: |
          node scripts/append-harness-history.js \
            runs/run-scheduled-summary.json \
            runs/history.csv

      - name: Create history PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            runs/history.csv
          commit-message: "chore: append scheduled harness history"
          title: "chore: update scheduled harness history"
          body: |-
            Automated history update from a successful scheduled harness run.
          branch: history/update-${{ github.run_id }}
          labels: runs-history
          delete-branch: true
