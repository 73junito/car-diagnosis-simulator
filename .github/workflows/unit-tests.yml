name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Note: consider pinning actions to specific commit SHAs for increased security.
# e.g. replace uses: actions/checkout@v4 with uses: actions/checkout@<COMMIT_SHA>

jobs:
  unit-tests:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Validate scenarios
        id: validate-scenarios
        run: npm run validate:scenarios
        continue-on-error: true

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/**
            torquemind-api/coverage/**

      - name: Fail if scenario validation failed
        if: steps.validate-scenarios.outcome == 'failure'
        run: exit 1

      - name: Install dependencies (torquemind-api)
        working-directory: torquemind-api
        run: npm ci

      - name: Run unit tests
        working-directory: torquemind-api
        run: npm test
