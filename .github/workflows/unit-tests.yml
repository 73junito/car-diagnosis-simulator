name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate scenarios
        id: validate-scenarios
        run: npm run validate:scenarios
        continue-on-error: true

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json

      - name: Fail if scenario validation failed
        if: steps.validate-scenarios.outcome == 'failure'
        run: exit 1

      - name: Install dependencies (torquemind-api)
        working-directory: torquemind-api
        run: npm ci

      - name: Run unit tests
        working-directory: torquemind-api
        run: npm test
