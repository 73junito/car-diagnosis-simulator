name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ['22', '24']
    env:
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enforce runtime matrix
        run: npm run validate:runtime-matrix

      - name: Verify lockfile sync
        run: npm ci --dry-run --ignore-scripts

      - name: Enforce text normalization policy
        run: npm run validate:text-normalization-policy

      - name: Enforce dependency runtime compatibility
        run: npm run validate:dependency-runtime-compatibility

      - name: Enforce dependency security exceptions
        run: npm run validate:dependency-security-exceptions

      - name: Enforce dependency automation policy
        run: npm run validate:dependency-automation

      - name: Enforce disposable Postgres registry policy
        run: npm run validate:ci-postgres-service-image

      - name: Enforce scheduled harness history integrity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            node scripts/verify-harness-history-integrity.js --baseline-ref FETCH_HEAD
          else
            node scripts/verify-harness-history-integrity.js
          fi

      - name: Validate public sitemap and canonical inventory
        run: npm run validate:public-indexability

      - name: Audit production dependencies
        if: matrix.node-version == '22'
        run: npm run audit:production-dependencies

      - name: Enforce no nock in tests
        run: |
          if grep -R --line-number -E "require\(['\"]nock['\"]\)|import\s+nock|from\s+['\"]nock['\"]" tests; then
            echo "ERROR: 'nock' import found in tests. Remove nock and use createFetchMock instead.";
            exit 1;
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate architecture schemas
        run: npm run validate:architecture-schemas

      - name: Run lint (Node 22)
        if: matrix.node-version == '22'
        run: |
          npm run lint --if-present

      - name: Generate deployment version
        run: npm run build

      - name: Run tests
        run: npm test --silent
