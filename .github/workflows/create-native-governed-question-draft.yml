name: Create native governed question draft

on:
  workflow_dispatch:
    inputs:
      scenario_id:
        description: Scenario question-bank ID
        required: true
        default: charging-system
        type: string
      model:
        description: Ollama Cloud model
        required: true
        default: gpt-oss:20b
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate one evidence-bound native draft
    runs-on: ubuntu-latest
    environment: ollama
    timeout-minutes: 10
    env:
      OLLAMA_API_KEY: ${{ secrets.API_GITHUB }}
      OLLAMA_API_URL: https://ollama.com/api/chat
      TORQUEMIND_ORCHESTRATION_PERSISTENCE: disabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Validate generation inputs and secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.scenario_id }}" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid scenario_id"
            exit 1
          fi
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo "Environment secret API_GITHUB is not configured"
            exit 1
          fi

      - name: Verify evidence eligibility
        shell: bash
        run: |
          node scripts/generate-scenario-question-drafts.js \
            --scenario="${{ inputs.scenario_id }}" \
            --target=1 \
            --model="${{ inputs.model }}" \
            --dry-run=true

      - name: Generate one draft
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-question-draft"
          node scripts/generate-scenario-question-drafts.js \
            --scenario="${{ inputs.scenario_id }}" \
            --target=1 \
            --model="${{ inputs.model }}" \
            --output="$RUNNER_TEMP/native-question-draft/generated-question-draft.json"

      - name: Upload native draft artifact
        uses: actions/upload-artifact@v7
        with:
          name: "native-question-draft-${{ inputs.scenario_id }}-${{ github.run_id }}"
          path: ${{ runner.temp }}/native-question-draft/generated-question-draft.json
          if-no-files-found: error
          retention-days: 14

  ingest:
    name: Persist native draft and initialize governance
    needs: generate
    runs-on: ubuntu-latest
    environment: pffdgqpynpbffbcnxmum_production
    timeout-minutes: 5
    env:
      TORQUEMIND_ENVIRONMENT: production
      TORQUEMIND_ORCHESTRATION_PERSISTENCE: supabase
      TORQUEMIND_ORCHESTRATION_SUPABASE_PROJECT_REF: pffdgqpynpbffbcnxmum
      SUPABASE_URL: https://pffdgqpynpbffbcnxmum.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
      GOVERNED_RUN_ID: native-draft:${{ github.run_id }}:${{ github.run_attempt }}:${{ inputs.scenario_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Download native draft artifact
        uses: actions/download-artifact@v8
        with:
          name: "native-question-draft-${{ inputs.scenario_id }}-${{ github.run_id }}"
          path: ${{ runner.temp }}/native-question-draft

      - name: Validate production secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Environment secret SERVICE_ROLE_KEY is not configured"
            exit 1
          fi

      - name: Ingest draft and initialize governed run
        shell: bash
        run: |
          node scripts/ingest-native-question-draft.js \
            --scenario="${{ inputs.scenario_id }}" \
            --run-id="$GOVERNED_RUN_ID" \
            --artifact="$RUNNER_TEMP/native-question-draft/generated-question-draft.json"

      - name: Governance notice
        shell: bash
        run: |
          echo "One question was persisted as draft provenance and initialized at governed state drafted."
          echo "Question citations were not persisted; evidence mapping remains a separate governed transition."
          echo "No technical review, instructional review, human approval, assessment eligibility, scored delivery, or release authority was created."
