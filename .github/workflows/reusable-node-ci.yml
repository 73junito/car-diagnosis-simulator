name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: '22'
      run-validate-scenarios:
        required: false
        default: 'true'

jobs:
  setup-and-validate:
    runs-on: ubuntu-latest
    outputs:
      scenarios_passed: ${{ steps.scenarios.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Validate scenarios
        id: scenarios
        if: ${{ inputs.run-validate-scenarios == 'true' }}
        run: |
          npm run validate:scenarios || true
        continue-on-error: true

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json

      - name: Set scenarios output
        id: setout
        run: |
          if [ -f reports/scenario-validation-report.json ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
