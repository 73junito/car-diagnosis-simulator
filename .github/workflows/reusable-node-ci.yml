name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: '22'
        type: string

      run-validate-scenarios:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  setup-and-validate:
    runs-on: ubuntu-latest

    outputs:
      scenarios_passed: ${{ steps.setout.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

      - name: Install dependencies (root)
        run: npm ci

      - name: Validate scenarios
        id: scenarios
        if: ${{ inputs.run-validate-scenarios }}
        run: npm run validate:scenarios

      - name: Upload scenario validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scenario-validation-report
          path: reports/scenario-validation-report.json
          if-no-files-found: warn

      - name: Test analytics tooling
        if: always()
        run: npm run test:analytics

      - name: Test analytics routes
        if: always()
        run: npm run test:analytics-routes

      - name: Test telemetry stream
        if: always()
        run: node scripts/run-telemetry-test.js

      - name: Test live session UI
        if: always()
        run: npm run test:live-session

      - name: Test live session route access
        if: always()
        run: npm run test:live-session-route

      - name: Test Supabase token auth scaffold
        if: always()
        run: node tests/supabase-token-auth.test.js

      - name: Test Supabase route auth
        if: always()
        run: node tests/supabase-route.test.js

      - name: Test telemetry storage
        if: always()
        run: node tests/telemetry-storage.test.js

      - name: Test telemetry history endpoint
        if: always()
        run: node tests/telemetry-history.test.js

      - name: Generate analytics exports
        if: always()
        run: npm run export:analytics

      - name: Upload analytics exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analytics-exports
          path: |
            reports/student-performance.csv
            reports/xapi-statements.json

      - name: Set scenarios output
        id: setout
        if: always()
        run: |
          if [ -f reports/scenario-validation-report.json ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
