name: Verify encrypted staging backup restoration

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'GitHub Actions run ID of encrypted staging backup'
        required: true
        type: string
      confirm:
        description: 'Type VERIFY-RESTORE'
        required: true
        type: string
      # The default must track the fingerprint algorithm version of
      # scripts/sql/restore-verification-matrix.sql. A baseline recorded under an
      # older normalisation is not comparable with the matrix emitted by the
      # current SQL, even when the restored schema is identical.
      baseline_manifest:
        description: 'Recorded backup baseline manifest to compare against'
        required: false
        default: 'docs/database/staging-restore-baseline-40034471907.json'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  restore-test:
    if: inputs.confirm == 'VERIFY-RESTORE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: jchfruprqpeypdttvlam_staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Retrieve encrypted backup artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-staging-database-${{ inputs.backup_run_id }}
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restore

      - name: Verify ciphertext, restore, and emit verification matrix
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.STAGING_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$BACKUP_PASSPHRASE" ]] || { echo "Missing encryption passphrase"; exit 1; }
          echo "::add-mask::$BACKUP_PASSPHRASE"
          cd "$RUNNER_TEMP/restore"
          chmod 700 .
          sha256sum -c staging.dump.gpg.sha256
          printf %s "$BACKUP_PASSPHRASE" > .passphrase
          chmod 600 .passphrase
          trap 'docker rm -f staging-restore-test >/dev/null 2>&1 || true; rm -f .passphrase staging.dump' EXIT
          gpg --batch --quiet --yes --pinentry-mode loopback \
              --passphrase-file .passphrase --output staging.dump --decrypt staging.dump.gpg
          rm -f .passphrase
          # Pinned official Supabase image from GHCR avoids public ECR transfer limits.
          docker run -d --name staging-restore-test --network none \
            -e POSTGRES_PASSWORD=disposable-restore-only \
            ghcr.io/supabase/postgres:17.6.1.167@sha256:6942962433a569e87f228b4d4ab7e11db5deca64e43babb3a038443ad6c4f1bb >/dev/null
          for n in {1..120}; do
            if docker exec staging-restore-test pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec staging-restore-test pg_isready -U postgres
          # Supabase's postgres role is intentionally not SUPERUSER. Realtime's
          # function-level log_min_messages setting requires supabase_admin.
          # Assert the role is privileged in this disposable container only.
          test "$(docker exec staging-restore-test psql -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = 'supabase_admin'")" = t
          # Supabase initializes auth/storage/etc in its default postgres DB.
          # Restore into a clean database made from template0 instead.
          docker exec staging-restore-test createdb \
            -U supabase_admin -T template0 staging_restore_check
          docker cp staging.dump staging-restore-test:/tmp/staging.dump
          # Fail closed on any restore error; do not mark a partial restore as verified.
          docker exec staging-restore-test pg_restore \
            --exit-on-error --no-owner --no-acl \
            -U supabase_admin -d staging_restore_check /tmp/staging.dump
          # Emit the machine-readable verification matrix from the restored copy.
          docker cp "$GITHUB_WORKSPACE/scripts/sql/restore-verification-matrix.sql" \
            staging-restore-test:/tmp/restore-verification-matrix.sql
          docker exec staging-restore-test psql -U supabase_admin -d staging_restore_check \
            -qAt -f /tmp/restore-verification-matrix.sql > "$RUNNER_TEMP/restore/restore-verification-matrix.json"
          test -s "$RUNNER_TEMP/restore/restore-verification-matrix.json"
          echo "Disposable PostgreSQL restore complete; verification matrix emitted."

      - name: Compare restored database against the recorded baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-restore-baseline.js \
            --matrix "$RUNNER_TEMP/restore/restore-verification-matrix.json" \
            --baseline "${{ inputs.baseline_manifest }}" \
            --report "$RUNNER_TEMP/restore/restore-verification-report.json"
          echo "RESTORE VERIFICATION: PASS"

      - name: Upload restore verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/restore/restore-verification-matrix.json
            ${{ runner.temp }}/restore/restore-verification-report.json
          retention-days: 30
          if-no-files-found: warn
