version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      runtime-core:
        dependency-type: "production"
        patterns:
          - "hono"
          - "@supabase/supabase-js"
        update-types:
          - "minor"
          - "patch"
      cloudflare-toolchain:
        dependency-type: "development"
        patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
        update-types:
          - "minor"
          - "patch"
      playwright-toolchain:
        dependency-type: "development"
        patterns:
          - "@playwright/test"
        update-types:
          - "minor"
          - "patch"
      jest-toolchain:
        dependency-type: "development"
        patterns:
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "babel-jest"
        update-types:
          - "minor"
          - "patch"
      lint-toolchain:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Compatibility shim for @zenuml/core's exact optional peer. Keep this
      # pinned until ZenUML changes its required playwright-core version.
      - dependency-name: "playwright-core"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Major upgrades are dedicated runtime/toolchain migrations, never routine
      # Dependabot version updates. Security alerts remain visible separately.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "deps(actions)"
    groups:
      pages-actions:
        patterns:
          - "actions/configure-pages"
          - "actions/deploy-pages"
          - "actions/upload-pages-artifact"
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      pull-request-actions:
        patterns:
          - "peter-evans/create-pull-request"
    ignore:
      # GitHub Action major upgrades are reviewed as dedicated supply-chain
      # changes instead of being bundled into routine automated maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
