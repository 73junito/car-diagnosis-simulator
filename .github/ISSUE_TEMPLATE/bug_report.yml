name: Bug report
description: Report a reproducible AutoLearnPro defect (do not include secrets or vulnerabilities)
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use private vulnerability reporting as described in SECURITY.md. Never paste secrets or learner data."
  - type: input
    id: surface
    attributes:
      label: Affected surface
      description: Public site, learner app, exam domain, Worker API, simulation lab, etc.
      placeholder: "e.g. app.autolearnpro.com / circuit lab"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser, branch/commit, sanitized logs, screenshots without personal data.
